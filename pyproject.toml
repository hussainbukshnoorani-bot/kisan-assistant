[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kisan"
version = "0.1.0"
description = "Kisan Assistant: bilingual (Urdu / Roman Urdu) mandi price chatbot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "rapidfuzz>=3.9",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "pgserver>=0.1.4",
    "time-machine>=2.15",
    "coverage[toml]>=7.6",
    "pip-audit>=2.7",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kisan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "e2e: conversation tests through the webhooks",
    "eval: golden eval set",
]

[tool.coverage.run]
source = ["kisan"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S608"]  # fixed SQL strings in test helpers
"src/kisan/db/migrations/versions/*" = ["E501"]
"scripts/*" = ["S602", "S607"]  # local helpers call the vercel CLI through the Windows shell

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["kisan"]
mypy_path = "src"
ignore_missing_imports = true
