openapi: 3.1.0
info:
  title: To-Do App API
  version: 1.0.0
  description: |
    JSON API for the to-do app. All endpoints except those marked `security: []` require a
    valid session cookie. Resources owned by another user respond 404 (existence is not revealed).
    State-changing requests must send `Content-Type: application/json` and a same-site `Origin`.
    Every response carries an `X-Request-Id` header.
servers:
  - url: /api
security:
  - sessionCookie: []

paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: Service and database are up
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status: { type: string, enum: [ok] }
                  db: { type: string, enum: [ok] }
        '503':
          $ref: '#/components/responses/Error'

  /auth/signup:
    post:
      summary: Create an account and start a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201':
          description: Account created; session cookie set
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /auth/signin:
    post:
      summary: Sign in and start a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Signed in; session cookie set
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /auth/signout:
    post:
      summary: End the current session
      responses:
        '204': { description: Signed out; cookie cleared }
        '401': { $ref: '#/components/responses/Error' }

  /auth/me:
    get:
      summary: Current signed-in user
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }

  /lists:
    get:
      summary: List the user's task lists (newest first)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of lists
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pageSize, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TaskList' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      summary: Create a list
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }

  /lists/{listId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      summary: Get one list
      responses:
        '200':
          description: The list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskList' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Rename a list
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: Delete a list and all its tasks
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /lists/{listId}/tasks:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      summary: List tasks in a list
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [all, open, done], default: all }
        - name: sort
          in: query
          description: >
            created = creation order (oldest first); due = earliest due date first, no due date last;
            priority = high → low. Ties broken by creation order.
          schema: { type: string, enum: [created, due, priority], default: created }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of tasks
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pageSize, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Task' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: Add a task to a list
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      summary: Edit a task and/or toggle done
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: Delete a task
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid

  parameters:
    ListId:
      name: listId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }

    User:
      type: object
      required: [id, email]
      properties:
        id: { type: integer }
        email: { type: string, format: email }

    ListInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: Trimmed before validation }

    TaskList:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Priority:
      type: string
      enum: [low, medium, high]

    TaskCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200, description: Trimmed before validation }
        dueDate: { type: [string, 'null'], format: date }
        priority: { $ref: '#/components/schemas/Priority', default: medium }

    TaskUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        dueDate: { type: [string, 'null'], format: date }
        priority: { $ref: '#/components/schemas/Priority' }
        done: { type: boolean }

    Task:
      type: object
      required: [id, listId, title, dueDate, priority, done, createdAt, updatedAt]
      properties:
        id: { type: integer }
        listId: { type: integer }
        title: { type: string }
        dueDate: { type: [string, 'null'], format: date }
        priority: { $ref: '#/components/schemas/Priority' }
        done: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION, UNAUTHENTICATED, INVALID_CREDENTIALS, CONFLICT, NOT_FOUND,
                     RATE_LIMITED, FORBIDDEN_ORIGIN, INTERNAL, UNAVAILABLE]
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
              description: Per-field messages (VALIDATION only)
            errorId: { type: string, description: Present for INTERNAL errors }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
